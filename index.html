<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pickle</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap"
            rel="stylesheet"
        />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Playfair Display", Georgia, serif;
                font-weight: 500;
                background: #f5f1e8;
                color: #1a1a1a;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 3rem 1rem;
            }
            input,
            button {
                font-family: inherit;
                font-weight: 500;
            }
            #container {
                width: 100%;
                max-width: 1100px;
                display: flex;
                flex-direction: column;
                border: 1.5px solid #06320b;
                background: #f5f1e8;
            }
            #messages {
                overflow-y: auto;
                padding: 2rem;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                min-height: 450px;
                max-height: 70vh;
            }
            .msg {
                line-height: 1.5;
                max-width: 80%;
            }
            .msg.user {
                align-self: flex-end;
                text-align: right;
            }
            .msg .role {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: #06320b;
                margin-bottom: 0.25rem;
            }
            .msg.loading .content {
                color: #06320b;
            }
            #input-area {
                display: flex;
                gap: 1rem;
                padding: 1.5rem;
                border-top: 1.5px solid #06320b;
            }
            #user-input {
                flex: 1;
                padding: 0.75rem 0;
                border: none;
                border-bottom: 1.5px solid #06320b;
                background: transparent;
                color: #1a1a1a;
                font-size: 1rem;
                outline: none;
            }
            #user-input:focus {
                border-bottom-width: 3px;
            }
            button {
                padding: 0.75rem 1.5rem;
                background: #06320b;
                color: #f5f1e8;
                border: none;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                cursor: pointer;
            }
            .tool {
                font-family: ui-monospace, monospace;
                font-size: 0.75rem;
                color: #555;
                background: #ebe6d8;
                border-left: 3px solid #06320b;
                padding: 0.5rem 0.75rem;
                margin: 0.25rem 0 0.75rem;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .tool .label {
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #06320b;
            }
            .locations {
                align-self: stretch;
                margin: 0.25rem 0 0.75rem;
            }
            .locations .caption {
                display: inline-block;
                font-size: 0.9rem;
                color: #06320b;
                border-bottom: 1.5px solid #06320b;
                padding-bottom: 2px;
                margin-bottom: 0.75rem;
            }
            .loc-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
            }
            @media (max-width: 700px) {
                .loc-grid {
                    grid-template-columns: 1fr;
                }
            }
            .loc-card {
                border: 1.5px solid #06320b;
                background: #fffdf8;
            }
            .loc-card iframe {
                width: 100%;
                height: 170px;
                border: 0;
                border-bottom: 1.5px solid #06320b;
                display: block;
            }
            .loc-info {
                padding: 0.6rem 0.75rem;
                font-size: 0.85rem;
                line-height: 1.5;
                color: #6b665c;
            }
            .loc-info b {
                display: block;
                font-weight: 500;
                font-size: 0.95rem;
                color: #06320b;
            }
            button:disabled {
                opacity: 0.3;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div id="messages"></div>
            <div id="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask Pickle!"
                    autocomplete="off"
                />
                <button id="send-btn">Send</button>
            </div>
        </div>
        <script>
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            let sessionId = null;

            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
                div.className =
                    "msg " +
                    (role === "you" ? "user" : "pickle") +
                    (isLoading ? " loading" : "");
                div.innerHTML =
                    '<div class="role">' +
                    role +
                    '</div><div class="content">' +
                    text +
                    "</div>";
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }

            // Show a map card for each court site the agent found
            function addLocations(result, before) {
                let data;
                try {
                    data = JSON.parse(result);
                } catch (e) {
                    return;
                }
                if (!data.sites || !data.sites.length) return;

                const wrap = document.createElement("div");
                wrap.className = "locations";
                const caption = document.createElement("div");
                caption.className = "caption";
                caption.textContent =
                    "Here " +
                    (data.sites.length === 1 ? "is the location" : "are the locations") +
                    " near " +
                    data.searched_near +
                    ":";
                wrap.appendChild(caption);

                const grid = document.createElement("div");
                grid.className = "loc-grid";
                for (const site of data.sites.slice(0, 3)) {
                    const q = encodeURIComponent(site.lat_lon);
                    const card = document.createElement("div");
                    card.className = "loc-card";

                    const map = document.createElement("iframe");
                    map.src = "https://maps.google.com/maps?q=" + q + "&z=16&output=embed";
                    map.loading = "lazy";
                    map.title = "Map of " + site.name;
                    card.appendChild(map);

                    const info = document.createElement("div");
                    info.className = "loc-info";
                    const name = document.createElement("b");
                    name.textContent = site.name;
                    info.appendChild(name);
                    const n = site.courts_at_site;
                    const lights =
                        site.has_lights === "yes"
                            ? " · lit"
                            : site.has_lights === "no"
                              ? " · no lights"
                              : "";
                    info.appendChild(
                        document.createTextNode(
                            site.distance_km + " km away · " + n + (n === 1 ? " court" : " courts") + lights,
                        ),
                    );
                    card.appendChild(info);
                    grid.appendChild(card);
                }
                wrap.appendChild(grid);
                messages.insertBefore(wrap, before);
            }

            async function send() {
                const text = userInput.value.trim();
                if (!text) return;

                userInput.value = "";
                sendBtn.disabled = true;
                addMessage("you", text);
                const loading = addMessage("pickle", "Thinking...", true);

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            session_id: sessionId,
                        }),
                    });
                    const data = await res.json();
                    sessionId = data.session_id;

                    // Show each tool the harness ran, above the assistant's answer
                    for (const call of data.tool_calls || []) {
                        const div = document.createElement("div");
                        div.className = "tool";
                        const label = document.createElement("span");
                        label.className = "label";
                        label.textContent = "tool call  ";
                        div.appendChild(label);
                        div.appendChild(
                            document.createTextNode(
                                call.name + "(" + JSON.stringify(call.args) + ")\n→ " + call.result,
                            ),
                        );
                        messages.insertBefore(div, loading);
                        if (call.name === "find_pickleball_courts") {
                            addLocations(call.result, loading);
                        }
                    }
                    loading.querySelector(".content").textContent =
                        data.response;
                    loading.classList.remove("loading");
                } catch (e) {
                    loading.querySelector(".content").textContent =
                        "Error: " + e.message;
                    loading.classList.remove("loading");
                }
                sendBtn.disabled = false;
                userInput.focus();
            }

            sendBtn.addEventListener("click", send);
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") send();
            });
            userInput.focus();
        </script>
    </body>
</html>
