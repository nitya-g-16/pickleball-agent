<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickle</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f1e8;
            color: #06320b;
            font-family: "Playfair Display", serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pickle logo in top-left */
        #top-left-brand {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.65rem;
            color: #06320b;
            z-index: 10;
        }

        #top-left-brand svg {
            width: 40px;
            height: 40px;
        }

        #top-left-brand span {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        #container {
            width: 90%;
            max-width: 1100px;
            border: 1.5px solid #06320b;
            background: #f5f1e8;
        }

        #messages {
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-height: 450px;
            max-height: 70vh;
        }

        .message {
            max-width: 80%;
            line-height: 1.5;
            font-size: 1rem;
        }

        .user {
            align-self: flex-end;
            text-align: right;
        }

        .assistant {
            align-self: flex-start;
        }

        .message-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.35rem;
            opacity: 0.65;
        }

        .message-text {
            white-space: pre-wrap;
        }

        #input-area {
            border-top: 1.5px solid #06320b;
            display: flex;
            align-items: center;
            padding: 1rem 1.25rem;
            gap: 1rem;
        }

        #input {
            flex: 1;
            border: none;
            border-bottom: 1px solid #06320b;
            outline: none;
            background: transparent;
            padding: 0.75rem 0;
            font-family: inherit;
            font-size: 1rem;
            color: #06320b;
        }

        #input::placeholder {
            color: #06320b;
            opacity: 0.55;
        }

        #send {
            border: 1px solid #06320b;
            background: #06320b;
            color: #f5f1e8;
            padding: 0.65rem 1rem;
            font-family: inherit;
            cursor: pointer;
        }

        #send:hover {
            opacity: 0.9;
        }

        #send:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .tool-card {
            background: #ebe6d8;
            border-left: 3px solid #06320b;
            padding: 0.8rem 1rem;
            font-size: 0.85rem;
            width: 100%;
        }

        .tool-name {
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .tool-result {
            white-space: pre-wrap;
            opacity: 0.8;
            max-height: 200px;
            overflow-y: auto;
        }

        .locations {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .location-card {
            border: 1px solid #06320b;
            background: #f5f1e8;
            padding: 1rem;
        }

        .location-title {
            font-size: 1rem;
            margin-bottom: 0.35rem;
        }

        .location-info {
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            opacity: 0.75;
        }

        .location-map {
            width: 100%;
            height: 250px;
            border: none;
            display: block;
        }

        .loading {
            opacity: 0.6;
            font-style: italic;
        }

        @media (max-width: 700px) {
            #container {
                width: 95%;
            }

            #messages {
                padding: 1.25rem;
            }

            .message {
                max-width: 90%;
            }

            #top-left-brand {
                top: 1rem;
                left: 1rem;
            }
        }
    </style>
</head>

<body>

    <!-- Pickle logo -->
    <div id="top-left-brand">
        <svg viewBox="0 0 64 64" aria-hidden="true">

            <!-- Paddle -->
            <path
                d="M20 8
                   C15 10 11 15 10 21
                   C8 30 12 39 19 46
                   L26 53
                   C29 56 34 56 37 53
                   L42 48
                   C45 45 45 40 42 37
                   L35 30
                   C32 27 28 25 25 22
                   C22 19 22 15 24 12
                   C25 9 23 7 20 8Z"
                fill="none"
                stroke="#06320b"
                stroke-width="2.5"
                stroke-linejoin="round"
            />

            <!-- Paddle handle -->
            <path
                d="M34 38 L46 50"
                fill="none"
                stroke="#06320b"
                stroke-width="5"
                stroke-linecap="round"
            />

            <!-- Pickleball -->
            <circle
                cx="45"
                cy="19"
                r="8"
                fill="none"
                stroke="#06320b"
                stroke-width="2.5"
            />

            <!-- Ball holes -->
            <circle cx="42" cy="16" r="1.3" fill="#06320b"/>
            <circle cx="48" cy="16" r="1.3" fill="#06320b"/>
            <circle cx="40" cy="20" r="1.3" fill="#06320b"/>
            <circle cx="46" cy="21" r="1.3" fill="#06320b"/>
            <circle cx="50" cy="20" r="1.3" fill="#06320b"/>
            <circle cx="44" cy="24" r="1.3" fill="#06320b"/>

        </svg>

        <span>Pickle</span>
    </div>

    <div id="container">

        <div id="messages">
            <div class="message assistant">
                <div class="message-label">Pickle</div>
                <div class="message-text">
                    Hey! I can help you find pickleball courts around New York and figure out if you can make it before dark.
                </div>
            </div>
        </div>

        <div id="input-area">
            <input
                id="input"
                type="text"
                placeholder="Ask Pickle where you can play..."
                autocomplete="off"
            />
            <button id="send">Send</button>
        </div>

    </div>

    <script>
        const messages = document.getElementById("messages");
        const input = document.getElementById("input");
        const send = document.getElementById("send");

        let sessionId = null;

        /*
         * Keep the newest content visible.
         */
        function scrollToBottom() {
            requestAnimationFrame(() => {
                messages.scrollTop = messages.scrollHeight;

                setTimeout(() => {
                    messages.scrollTop = messages.scrollHeight;
                }, 50);
            });
        }

        function addMessage(role, text, isLoading = false) {
            const div = document.createElement("div");
            div.className = `message ${role}`;

            if (isLoading) {
                div.classList.add("loading");
            }

            div.innerHTML = `
                <div class="message-label">
                    ${role === "user" ? "You" : "Pickle"}
                </div>
                <div class="message-text"></div>
            `;

            div.querySelector(".message-text").textContent = text;

            messages.appendChild(div);

            scrollToBottom();

            return div;
        }

        function addToolCalls(toolCalls) {
            for (const tool of toolCalls) {
                const card = document.createElement("div");
                card.className = "tool-card";

                const args = JSON.stringify(tool.args, null, 2);

                card.innerHTML = `
                    <div class="tool-name">
                        Tool: ${escapeHtml(tool.name)}
                    </div>

                    <div>
                        <strong>Arguments:</strong>
                        <pre>${escapeHtml(args)}</pre>
                    </div>

                    <div class="tool-result">
                        <strong>Result:</strong>
                        <br>
                        ${escapeHtml(String(tool.result))}
                    </div>
                `;

                messages.appendChild(card);

                scrollToBottom();
            }
        }

        function addLocations(toolCalls) {
            const locationTool = toolCalls.find(
                tool => tool.name === "find_pickleball_courts"
            );

            if (!locationTool) {
                return;
            }

            let result;

            try {
                result =
                    typeof locationTool.result === "string"
                        ? JSON.parse(locationTool.result)
                        : locationTool.result;
            } catch {
                return;
            }

            /*
             * find_pickleball_courts returns "sites".
             */
            if (!result || !Array.isArray(result.sites)) {
                return;
            }

            const locations = document.createElement("div");
            locations.className = "locations";

            for (const court of result.sites) {
                if (!court.lat_lon) {
                    continue;
                }

                const card = document.createElement("div");
                card.className = "location-card";

                const title = document.createElement("div");
                title.className = "location-title";
                title.textContent = court.name || "Pickleball Court";

                /*
                 * Build the information line.
                 * Public/private is shown first.
                 * If access is unknown, it is simply left out.
                 */
                const info = document.createElement("div");
                info.className = "location-info";

                const infoParts = [];

                if (court.courts_at_site !== undefined) {
                    const courtCount = court.courts_at_site === 1
                        ? "1 court"
                        : `${court.courts_at_site} courts`;

                    infoParts.push(courtCount);
                }

                if (
                    court.access &&
                    court.access !== "unknown"
                ) {
                    infoParts.push(
                        court.access.charAt(0).toUpperCase() +
                        court.access.slice(1)
                    );
                }

                if (court.distance_km !== undefined) {
                    const miles = court.distance_km * 0.621371;
                    infoParts.push(`${miles.toFixed(1)} mi`);
                }

                if (court.travel_minutes !== undefined) {
                    infoParts.push(`${court.travel_minutes} min`);
                }

                info.textContent = infoParts.join(" · ");

                /*
                 * lat_lon from tools.py is "lat,lon".
                 */
                const [lat, lon] = String(court.lat_lon)
                    .split(",")
                    .map(Number);

                if (
                    !Number.isFinite(lat) ||
                    !Number.isFinite(lon)
                ) {
                    continue;
                }

                const map = document.createElement("iframe");
                map.className = "location-map";
                map.loading = "lazy";
                map.title = court.name || "Pickleball Court";

                const delta = 0.005;

                map.src =
                    `https://www.openstreetmap.org/export/embed.html?` +
                    `bbox=${lon - delta}%2C${lat - delta}%2C${lon + delta}%2C${lat + delta}` +
                    `&layer=mapnik&marker=${lat}%2C${lon}`;

                /*
                 * The iframe changes the height of the page after
                 * it finishes loading, so scroll again here.
                 */
                map.addEventListener("load", scrollToBottom);

                card.appendChild(title);
                card.appendChild(info);
                card.appendChild(map);

                locations.appendChild(card);

                scrollToBottom();
            }

            if (locations.children.length > 0) {
                messages.appendChild(locations);
                scrollToBottom();
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function sendMessage() {
            const text = input.value.trim();

            if (!text) {
                return;
            }

            input.value = "";
            send.disabled = true;

            addMessage("user", text);

            const loading = addMessage(
                "assistant",
                "Finding courts...",
                true
            );

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: text,
                        session_id: sessionId
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                sessionId = data.session_id;

                /*
                 * Remove temporary loading message.
                 */
                loading.remove();

                /*
                 * Show tool calls first.
                 */
                if (
                    data.tool_calls &&
                    data.tool_calls.length > 0
                ) {
                    addToolCalls(data.tool_calls);
                }

                /*
                 * Add map cards after the tool calls.
                 */
                addLocations(data.tool_calls || []);

                /*
                 * Finally show Pickle's response.
                 */
                addMessage("assistant", data.response);

                scrollToBottom();

            } catch (error) {
                loading.remove();

                addMessage(
                    "assistant",
                    `Sorry, something went wrong: ${error.message}`
                );

                scrollToBottom();
            }

            send.disabled = false;
            input.focus();
        }

        send.addEventListener("click", sendMessage);

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        /*
         * Also keep the newest message visible if the window
         * changes size.
         */
        window.addEventListener("resize", scrollToBottom);
    </script>

</body>
</html>
