<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pickle</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap"
            rel="stylesheet"
        />
 
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
 
            body {
                font-family: "Playfair Display", Georgia, serif;
                font-weight: 500;
                background: #eef4ea;
                color: #1a1a1a;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 3rem 1rem;
            }
 
            input,
            button {
                font-family: inherit;
                font-weight: 500;
            }
 
            #container {
                width: 100%;
                max-width: 1100px;
                display: flex;
                flex-direction: column;
                border: 1.5px solid #06320b;
                background: rgba(245, 241, 232, 0.86);
                position: relative;
                z-index: 1;
            }
 
            #court-bg {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
                pointer-events: none;
            }
 
            /* Pickle header */
 
            #header {
                display: flex;
                align-items: center;
                gap: 0.65rem;
                padding: 1rem 1.5rem;
                border-bottom: 1.5px solid #06320b;
                color: #06320b;
            }
 
            #logo {
                width: 40px;
                height: 37px;
                flex-shrink: 0;
            }
 
            #brand {
                font-size: 1.25rem;
                letter-spacing: 0.02em;
            }
 
            #messages {
                overflow-y: auto;
                padding: 2rem;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                min-height: 450px;
                max-height: 70vh;
            }
 
            .msg {
                line-height: 1.5;
                max-width: 80%;
            }
 
            .msg.user {
                align-self: flex-end;
                text-align: right;
            }
 
            .msg .role {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: #06320b;
                margin-bottom: 0.25rem;
            }
 
            .msg.loading .content {
                color: #06320b;
            }
 
            #input-area {
                display: flex;
                gap: 1rem;
                padding: 1.5rem;
                border-top: 1.5px solid #06320b;
            }
 
            #user-input {
                flex: 1;
                padding: 0.75rem 0;
                border: none;
                border-bottom: 1.5px solid #06320b;
                background: transparent;
                color: #1a1a1a;
                font-size: 1rem;
                outline: none;
            }
 
            #user-input:focus {
                border-bottom-width: 3px;
            }
 
            button {
                padding: 0.75rem 1.5rem;
                background: #06320b;
                color: #f5f1e8;
                border: none;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                cursor: pointer;
            }
 
            .tool {
                font-family: ui-monospace, monospace;
                font-size: 0.75rem;
                color: #555;
                background: #ebe6d8;
                border-left: 3px solid #06320b;
                padding: 0.5rem 0.75rem;
                margin: 0.25rem 0 0.75rem;
                white-space: pre-wrap;
                word-break: break-word;
            }
 
            .tool .label {
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #06320b;
            }
 
            .locations {
                align-self: stretch;
                margin: 0.25rem 0 0.75rem;
            }
 
            .locations .caption {
                display: inline-block;
                font-size: 0.9rem;
                color: #06320b;
                border-bottom: 1.5px solid #06320b;
                padding-bottom: 2px;
                margin-bottom: 0.75rem;
            }
 
            .loc-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
            }
 
            @media (max-width: 700px) {
                .loc-grid {
                    grid-template-columns: 1fr;
                }
            }
 
            .loc-card {
                border: 1.5px solid #06320b;
                background: #fffdf8;
            }
 
            .loc-card iframe {
                width: 100%;
                height: 170px;
                border: 0;
                border-bottom: 1.5px solid #06320b;
                display: block;
            }
 
            .loc-info {
                padding: 0.6rem 0.75rem;
                font-size: 0.85rem;
                line-height: 1.5;
                color: #6b665c;
            }
 
            .loc-info b {
                display: block;
                font-weight: 500;
                font-size: 0.95rem;
                color: #06320b;
            }
 
            button:disabled {
                opacity: 0.3;
            }
        </style>
    </head>
 
    <body>
        <svg id="court-bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <g id="player" fill="#d6e6cf" stroke="#d6e6cf" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="0" cy="-285" r="24" stroke="none" />
                    <line x1="0" y1="-248" x2="0" y2="-140" stroke-width="56" />
                    <line x1="-14" y1="-140" x2="-34" y2="-10" stroke-width="26" />
                    <line x1="14" y1="-140" x2="30" y2="-10" stroke-width="26" />
                    <polyline points="0,-235 -38,-175 -30,-130" fill="none" stroke-width="18" />
                    <polyline points="0,-235 55,-195 98,-222" fill="none" stroke-width="18" />
                    <g transform="rotate(25 104 -226)">
                        <line x1="104" y1="-226" x2="104" y2="-250" stroke-width="10" />
                        <rect x="82" y="-306" width="44" height="58" rx="20" stroke="none" />
                    </g>
                </g>
                <pattern id="mesh" width="22" height="22" patternUnits="userSpaceOnUse">
                    <path d="M0 0H22M0 0V22" stroke="#d6e6cf" stroke-width="2" fill="none" />
                </pattern>
            </defs>
 
            <g fill="none" stroke="#d6e6cf" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
                <polygon points="430,450 1170,450 1480,870 120,870" />
                <line x1="253" y1="690" x2="1347" y2="690" />
                <line x1="356" y1="550" x2="1244" y2="550" />
                <line x1="800" y1="690" x2="800" y2="870" />
                <line x1="800" y1="450" x2="800" y2="550" />
            </g>
 
            <ellipse cx="300" cy="848" rx="70" ry="12" fill="#d6e6cf" opacity="0.7" />
            <ellipse cx="1160" cy="545" rx="36" ry="6" fill="#d6e6cf" opacity="0.7" />
            <use href="#player" transform="translate(300 840)" />
            <use href="#player" transform="translate(1160 538) scale(-0.5 0.5)" />
 
            <rect x="327" y="520" width="946" height="70" fill="url(#mesh)" />
            <g stroke="#d6e6cf" stroke-linecap="round">
                <line x1="327" y1="520" x2="1273" y2="520" stroke-width="10" />
                <line x1="327" y1="512" x2="327" y2="600" stroke-width="12" />
                <line x1="1273" y1="512" x2="1273" y2="600" stroke-width="12" />
            </g>
 
            <circle cx="1440" cy="250" r="38" fill="#d6e6cf" />
            <g fill="#eef4ea">
                <circle cx="1426" cy="236" r="5" />
                <circle cx="1454" cy="236" r="5" />
                <circle cx="1440" cy="252" r="5" />
                <circle cx="1422" cy="266" r="5" />
                <circle cx="1458" cy="266" r="5" />
            </g>
        </svg>
 
        <div id="container">
 
            <!-- Pickle header -->
            <div id="header">
                <svg
                    id="logo"
                    viewBox="-52 -82 104 96"
                    xmlns="http://www.w3.org/2000/svg"
                    role="img"
                    aria-label="Crossed pickleball paddles logo"
                >
                    <g transform="rotate(-28)">
                        <rect x="-5" y="-30" width="10" height="38" rx="2" fill="#06320b" />
                        <rect x="-20" y="-82" width="40" height="54" rx="20" fill="#06320b" />
                        <g fill="#f5f1e8">
                        <circle cx="-9" cy="-68" r="2.2" /><circle cx="0" cy="-68" r="2.2" /><circle cx="9" cy="-68" r="2.2" />
                        <circle cx="-9" cy="-56" r="2.2" /><circle cx="0" cy="-56" r="2.2" /><circle cx="9" cy="-56" r="2.2" />
                        <circle cx="-5" cy="-44" r="2.2" /><circle cx="5" cy="-44" r="2.2" />
                        </g>
                    </g>
                    <g transform="rotate(28)">
                        <rect x="-5" y="-30" width="10" height="38" rx="2" fill="#06320b" stroke="#f5f1e8" stroke-width="2" />
                        <rect x="-20" y="-82" width="40" height="54" rx="20" fill="#06320b" />
                        <g fill="#f5f1e8">
                        <circle cx="-9" cy="-68" r="2.2" /><circle cx="0" cy="-68" r="2.2" /><circle cx="9" cy="-68" r="2.2" />
                        <circle cx="-9" cy="-56" r="2.2" /><circle cx="0" cy="-56" r="2.2" /><circle cx="9" cy="-56" r="2.2" />
                        <circle cx="-5" cy="-44" r="2.2" /><circle cx="5" cy="-44" r="2.2" />
                        </g>
                    </g>
                </svg>
 
                <div id="brand">Pickle</div>
            </div>
 
            <div id="messages"></div>
 
            <div id="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask Pickle!"
                    autocomplete="off"
                />
                <button id="send-btn">Send</button>
            </div>
        </div>
 
        <script>
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            let sessionId = null;
 
            function scrollToBottom() {
                messages.scrollTo({
                    top: messages.scrollHeight,
                    behavior: "smooth"
                });
            }
 
            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
 
                div.className =
                    "msg " +
                    (role === "you" ? "user" : "pickle") +
                    (isLoading ? " loading" : "");
 
                div.innerHTML =
                    '<div class="role">' +
                    role +
                    '</div><div class="content">' +
                    text +
                    "</div>";
 
                messages.appendChild(div);
                scrollToBottom();
 
                return div;
            }
 
            // Show a map card for each court site the agent found
            function addLocations(result, before) {
                let data;
 
                try {
                    data = JSON.parse(result);
                } catch (e) {
                    return;
                }
 
                if (!data.sites || !data.sites.length) return;
 
                const wrap = document.createElement("div");
                wrap.className = "locations";
 
                const caption = document.createElement("div");
                caption.className = "caption";
 
                caption.textContent =
                    "Here " +
                    (data.sites.length === 1
                        ? "is the location"
                        : "are the locations") +
                    " near " +
                    data.searched_near +
                    ":";
 
                wrap.appendChild(caption);
 
                const grid = document.createElement("div");
                grid.className = "loc-grid";
 
                for (const site of data.sites.slice(0, 3)) {
                    const q = encodeURIComponent(site.lat_lon);
 
                    const card = document.createElement("div");
                    card.className = "loc-card";
 
                    const map = document.createElement("iframe");
                    map.src =
                        "https://maps.google.com/maps?q=" +
                        q +
                        "&z=16&output=embed";
 
                    map.loading = "lazy";
                    map.title = "Map of " + site.name;
 
                    card.appendChild(map);
 
                    const info = document.createElement("div");
                    info.className = "loc-info";
 
                    const name = document.createElement("b");
                    name.textContent = site.name;
 
                    info.appendChild(name);
 
                    const n = site.courts_at_site;
 
                    const lights =
                        site.has_lights === "yes"
                            ? " · lit"
                            : site.has_lights === "no"
                              ? " · no lights"
                              : "";
 
                    // Show public/private only when the tool knows it.
                    const access =
                        site.access &&
                        site.access !== "unknown"
                            ? " · " +
                              site.access.charAt(0).toUpperCase() +
                              site.access.slice(1)
                            : "";
 
                    info.appendChild(
                        document.createTextNode(
                            n +
                                (n === 1 ? " court" : " courts") +
                                access +
                                " · " +
                                site.distance_km +
                                " km " +
                                (site.travel_minutes !== undefined
                                    ? "· " +
                                      site.travel_minutes +
                                      " min " +
                                      data.travel_mode
                                    : "away") +
                                lights
                        )
                    );
 
                    card.appendChild(info);
                    grid.appendChild(card);
                }
 
                wrap.appendChild(grid);
                messages.insertBefore(wrap, before);
 
                scrollToBottom();
            }
 
            async function send() {
                const text = userInput.value.trim();
 
                if (!text) return;
 
                userInput.value = "";
                sendBtn.disabled = true;
 
                addMessage("you", text);
 
                const loading = addMessage(
                    "pickle",
                    "Thinking...",
                    true
                );
 
                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            message: text,
                            session_id: sessionId
                        })
                    });
 
                    const data = await res.json();
 
                    sessionId = data.session_id;
 
                    // Show each tool the harness ran,
                    // above the assistant's answer
                    for (const call of data.tool_calls || []) {
                        const div = document.createElement("div");
                        div.className = "tool";
 
                        const label = document.createElement("span");
                        label.className = "label";
                        label.textContent = "tool call  ";
 
                        div.appendChild(label);
 
                        div.appendChild(
                            document.createTextNode(
                                call.name +
                                    "(" +
                                    JSON.stringify(call.args) +
                                    ")\n→ " +
                                    call.result
                            )
                        );
 
                        messages.insertBefore(div, loading);
 
                        scrollToBottom();
 
                        if (
                            call.name ===
                            "find_pickleball_courts"
                        ) {
                            addLocations(
                                call.result,
                                loading
                            );
                        }
                    }
 
                    loading.querySelector(
                        ".content"
                    ).textContent = data.response;
 
                    loading.classList.remove("loading");
 
                    scrollToBottom();
                } catch (e) {
                    loading.querySelector(
                        ".content"
                    ).textContent =
                        "Error: " + e.message;
 
                    loading.classList.remove("loading");
 
                    scrollToBottom();
                }
 
                sendBtn.disabled = false;
                userInput.focus();
            }
 
            sendBtn.addEventListener("click", send);
 
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") {
                    send();
                }
            });
 
            userInput.focus();
        </script>
    </body>
</html>
